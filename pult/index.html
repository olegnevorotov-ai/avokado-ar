  <template id="intro-title">
    <div class="intro title-slide">
      <p class="eyebrow">Научная конференция · Исследовательский проект</p>
      <h2>Как косточка авокадо становится деревом</h2>
      <p id="title-credit">Автор: Неворотова Полина Олеговна, 1 класс</p>
      <p class="subtitle">Опыт на компьютере: 3D-модель в Blender, помогал искусственный интеллект</p>
    </div>
  </template>
  <template id="intro-goal">
    <div class="intro goal-slide">
      <h2 class="eyebrow">Цель проекта</h2>
      <p class="goal">Узнать, что нужно косточке авокадо, чтобы из неё выросло дерево.</p>
      <p><strong>Гипотеза:</strong> косточке нужны вода, тепло и свет.<br>И чем больше воды, тем лучше.</p>
    </div>
  </template>
  <template id="intro-facts">
    <section class="facts-slide">
      <h2>А вы знали?</h2>
          <div class="facts">
      <div class="fact">
        <svg id="height-comparison" viewBox="0 0 220 150" role="img">
          <line x1="8" y1="140" x2="212" y2="140" stroke="#c9d3bb" stroke-width="2"/>
          <rect x="146" y="22" width="10" height="118" fill="#6e4126"/>
          <ellipse cx="151" cy="50" rx="52" ry="32" fill="#4b7a22"/>
          <rect x="30" y="132.3" width="8" height="7.7" fill="#4b7a22"/>
          <circle cx="72" cy="121" r="4" fill="#1d2916"/>
          <rect x="69" y="125" width="6" height="15" rx="3" fill="#1d2916"/>
          <g text-anchor="middle" font-size="11" font-weight="700" fill="#56664a">
            <text x="34" y="124" id="sprout-height"></text>
            <text x="72" y="110" id="student-height"></text>
            <text x="151" y="12" id="tree-height"></text>
          </g>
        </svg>
        <h3 class="big" id="tree-height-title"></h3>
        <p>Такой высоты авокадо вырастает в природе. Это выше шестиэтажного дома.</p>
      </div>
      <div class="fact">
        <h3 class="big">Ягода</h3>
        <p>Для ботаников авокадо — ягода с одной большой косточкой, как вишня.</p>
      </div>
      <div class="fact">
        <h3 class="big">Мексика</h3>
        <p>Родина авокадо. Древние ацтеки называли его «ахуакатль».</p>
      </div>
      <div class="fact">
        <h3 class="big">Гигантские ленивцы</h3>
        <p>Огромные косточки когда-то глотали и разносили древние гиганты. Они вымерли, и теперь авокадо разносит только человек.</p>
      </div>
    </div>
    </section>
  </template>
